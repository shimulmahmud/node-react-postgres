apiVersion: apps/v1
kind: Deployment
metadata:
  name: bullmq-worker
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bullmq-worker
  template:
    metadata:
      labels:
        app: bullmq-worker
    spec:
      containers:
        - name: bullmq-worker
          image: ghcr.io/shimulmahmud/node-react-postgres-platform-backend:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          command: ["npm", "run", "worker"]
