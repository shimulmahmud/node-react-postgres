apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/shimulmahmud/node-react-postgres-platform-frontend:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: NGINX_BACKEND_HOST
              value: backend-service
          ports:
            - containerPort: 80
