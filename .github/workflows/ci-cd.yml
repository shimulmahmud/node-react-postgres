name: CI/CD

on:
  push:
    branches:
      - master
      - "pre-release/v*"
      - "release/v*"
  workflow_dispatch:
    inputs:
      rollback_namespace:
        description: "Namespace to roll back (leave empty to skip)"
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: shimulmahmud/node-react-postgres-platform-backend
  IMAGE_FRONTEND: shimulmahmud/node-react-postgres-platform-frontend

jobs:
  build-and-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend build validation
        working-directory: backend
        run: node --check src/index.js

      - name: Backend tests
        working-directory: backend
        run: npm test --if-present

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  build-and-push:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      namespace: ${{ steps.meta.outputs.namespace }}
    steps:
      - uses: actions/checkout@v4

      # Tag = <branch-name>-<short-sha> so every image is traceable back to
      # the exact commit and branch that produced it.
      - name: Compute image tag and target namespace
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "tag=${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          case "${GITHUB_REF_NAME}" in
            master) echo "namespace=dev" >> "$GITHUB_OUTPUT" ;;
            pre-release/v*) echo "namespace=preprod" >> "$GITHUB_OUTPUT" ;;
            release/v*) echo "namespace=release" >> "$GITHUB_OUTPUT" ;;
          esac

      # GITHUB_TOKEN is short-lived and scoped to this workflow run.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.namespace }}-latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.namespace }}-latest

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: self-hosted
    environment: ${{ needs.build-and-push.outputs.namespace }}
    steps:
      - uses: actions/checkout@v4

      # This runner must be installed on the machine/network that can reach
      # the local kind cluster; GitHub-hosted runners cannot reach localhost.
      - name: Verify Kubernetes access
        run: |
          kubectl config current-context
          kubectl cluster-info

      - name: Deploy manifests to ${{ needs.build-and-push.outputs.namespace }}
        env:
          NAMESPACE: ${{ needs.build-and-push.outputs.namespace }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/manifests
          cp k8s/*.yaml /tmp/manifests/

          # Point the deployments at the image just built and pushed.
          sed -i "s#image: .*node-react-postgres-platform-backend:.*#image: ${REGISTRY}/${IMAGE_BACKEND}:${TAG}#" /tmp/manifests/backend-deployment.yaml
          sed -i "s#image: .*node-react-postgres-platform-backend:.*#image: ${REGISTRY}/${IMAGE_BACKEND}:${TAG}#" /tmp/manifests/bullmq-worker-deployment.yaml
          sed -i "s#image: .*node-react-postgres-platform-frontend:.*#image: ${REGISTRY}/${IMAGE_FRONTEND}:${TAG}#" /tmp/manifests/frontend-deployment.yaml

          # Re-target every manifest at the environment-specific namespace.
          sed -i "s/namespace: dev/namespace: ${NAMESPACE}/" /tmp/manifests/*.yaml

          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n "${NAMESPACE}" -f /tmp/manifests/
          kubectl rollout status -n "${NAMESPACE}" deployment/backend --timeout=120s
          kubectl rollout status -n "${NAMESPACE}" deployment/frontend --timeout=120s

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_namespace != ''
    runs-on: self-hosted
    steps:
      # Fast path: undo the last rollout. The slower/more precise path is
      # re-running this workflow with a previous commit checked out, which
      # rebuilds and redeploys that exact previous image tag.
      - name: Roll back last deployment
        env:
          NAMESPACE: ${{ inputs.rollback_namespace }}
        run: |
          kubectl rollout undo -n "${NAMESPACE}" deployment/backend
          kubectl rollout undo -n "${NAMESPACE}" deployment/frontend
